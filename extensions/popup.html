<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PhishGuard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            background-color: #0f1117;
            color: white;
            padding: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #1565c0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        .logo-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .status-badge {
            font-size: 11px;
            background: #1a3a1a;
            color: #4caf50;
            padding: 3px 9px;
            border-radius: 20px;
            font-weight: 500;
        }
        .card {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .card-label {
            font-size: 11px;
            color: #8892a4;
            margin-bottom: 6px;
        }
        .current-url {
            font-size: 13px;
            color: #e2e8f0;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }
        .site-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }
        .status-text {
            font-size: 12px;
            color: #4caf50;
            font-weight: 500;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .stat-card {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 10px;
        }
        .stat-label {
            font-size: 10px;
            color: #8892a4;
            margin-bottom: 3px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 600;
        }
        .stat-value.threats { color: #ef5350; }
        .stat-value.scanned { color: white; }
        .dashboard-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 9px;
            background: #1565c0;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .dashboard-btn:hover { background: #1976d2; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo-icon">🛡️</div>
            <span class="logo-text">PhishGuard</span>
        </div>
        <span class="status-badge">Active</span>
    </div>

    <div class="card">
        <p class="card-label">Current page</p>
        <p class="current-url" id="current-url">Scanning...</p>
        <div class="site-status">
            <div class="status-dot" id="status-dot"></div>
            <span class="status-text" id="status-text">Checking...</span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <p class="stat-label">Scanned today</p>
            <p class="stat-value scanned" id="scanned-count">—</p>
        </div>
        <div class="stat-card">
            <p class="stat-label">Threats blocked</p>
            <p class="stat-value threats" id="threats-count">—</p>
        </div>
    </div>

    <a href="https://friendly-mandazi-cc5db3.netlify.app/" target="_blank" class="dashboard-btn">
        📊 Open analyst dashboard →
    </a>

    <script src="popup.js"></script>
</body>
</html>
